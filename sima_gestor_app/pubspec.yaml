name: SimaGestor
description: "Aplicátivo do SimaGestor para celulares"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  intl: 0.20.2
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.5.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5
  signature: ^5.5.0
  permission_handler: ^11.3.0
  camera: ^0.11.3
  path: ^1.9.1
  shared_preferences: ^2.2.2
  

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
